# Generated by stoatworks-unraid/scripts/gen-launcher.mjs from fleet.json.
# Repo: openflash. Edit fleet.json and regenerate — direct edits are overwritten.
#
# openflash as a tray app: the launcher serves the built site itself.
#
# No child process and no [inject] block. The site is bundled as a resource
# and served in-process on the interface and port chosen in the panel — the
# same port the container and the Unraid template use, so the three agree.
# The site's _headers file ships beside it and is honoured, so this copy sends
# the same CSP and cache headers as the hosted one.

[app]
name = "openflash"
url = "http://{host}:{port}/"
default_port = 8536

[serve]
mode = "static"
dir = "{resource}/site"
not_found = "none"

[app.theme]
bg = "#0f1115"
panel = "#161a21"
"panel-2" = "#1d222b"
border = "#2a2f3a"
text = "#e8eaf0"
muted = "#aab2c0"
dim = "#6b7280"
accent = "#7cc4ff"
"accent-soft" = "#17263a"
good = "#37835c"
