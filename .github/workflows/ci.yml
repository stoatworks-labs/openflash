name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  devices-up-to-date:
    # The device database is generated from the LineageOS wiki and committed.
    # This says whether upstream has moved -- it does not fail the build, because
    # upstream moving is normal and is not a defect in this repo.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run devices
      - run: git diff --stat --exit-code public/data/devices.json
